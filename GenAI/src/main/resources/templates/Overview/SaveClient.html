    <h1> Save Client </h1>

    <div th:if="${mode == 'save'}">
        <form  th:action="@{/client/save}" th:object="${data}" method="post">

            <!-- Type -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Type:</label>
                <input type="text" class="form-control" id="date" th:value="${data.type}" th:field="*{type}" aria-describedby="emailHelp">
            </div>

            <!-- Source -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Source:</label>
                <input type="text" class="form-control" id="date" th:value="${data.source}" th:field="*{source}" aria-describedby="emailHelp">
            </div>

            <!-- Date -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Date:</label>
                <input type="text" class="form-control" id="date" maxlength="10"  th:value="${data.date}" th:field="*{date}" aria-describedby="emailHelp">
            </div>

            <!-- client's name -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Client's name:</label>
                <input type="text" class="form-control" id="date" th:value="${data.clientName}" th:field="*{clientName}" τη aria-describedby="emailHelp">
            </div>

            <br>
            
            <!-- Email-->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email:</label>
                <input type="email" class="form-control" id="date" th:value="${data.email}" th:field="*{email}" aria-describedby="emailHelp">
            </div>
                    
            <!-- Phone -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Phone:</label>
                <input type="tel" maxlength="10" class="form-control" id="date" th:value="${data.phone}" th:field="*{phone}" aria-describedby="emailHelp">
            </div>
            
            
            <!-- Company -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Company:</label>
                <input type="text" class="form-control" id="date" th:value="${data.company}" th:field="*{company}" aria-describedby="emailHelp">
            </div>

            
            <!-- Company -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Service Interest:</label>
                <input type="text" class="form-control" id="date" th:value="${data.serviceInterest}" th:field="*{serviceInterest}" aria-describedby="emailHelp">
            </div>


            <!-- Priority -->
            <div class="mb-3">
                <label for="prioritySelect" class="form-label">Priority:</label>
                <select id="prioritySelect" class="form-select" name="priority" th:field="*{priority}">
                    <option value="Low" th:attr="selected=${data.priority == 'LOW' ? 'selected' : null}">Low</option>
                    <option value="Medium" th:attr="selected=${data.priority == 'MEDIUM' ? 'selected' : null}">Medium</option>
                    <option value="High" th:attr="selected=${data.priority == 'HIGH' ? 'selected' : null}">High</option>
                </select>
            </div>

            <!-- Message -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">message:</label>
                <textarea style="width: auto;height: auto;" th:value="${data.Message}" th:field="*{Message}"> </textarea>
                <br>
            </div>

            <!-- Body mail -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email Body:</label>
                <p th:text="${data.bodyMail}"></p>
                <br>
            </div>

    </div>
