<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
	<head>
	    <!-- Required meta tags -->
	    <meta charset="utf-8">

	    <!-- Bootstrap CSS -->
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

		<title>Overview</title>
    <style>
      body{
        margin: 5%;
      }
    </style>
	</head>
<body>
	<h1>GenAI</h1><br>


	
  <!--form to upload -->
  
  <div th:if="${message}">
    
    <!-- Simple message-->
    <div th:if="${status == 'primary'}">
      <div class="alert alert-secondary" role="alert">
        <h2 th:text="${message}"/>
      </div> 
    </div>

    <!-- sucess message-->
    <div th:if="${status == 'success'}">
      <div class="alert alert-success" role="alert">
        <h2 th:text="${message}"/>
      </div> 
    </div>

    <!-- fail message-->
    <div th:if="${status == 'fail'}">
      <div class="alert alert-danger" role="alert">
        <h2 th:text="${message}"/>
      </div> 
    </div>
	</div>


  <div class="container text-center">
    <div class="row">
      <div class="col">
        <div class="card text-bg-primary mb-3" style="max-width: 18rem;">
          <form method="POST" enctype="multipart/form-data" action="/upload">
            <table>
              <tr><td>File to upload:</td><td><input type="file" name="file" /></td></tr>
              <tr><td></td><td><input type="submit" value="Upload" /></td></tr>
            </table>
          </form>
        </div>
      </div>
      <div class="col">
        
      </div>
      <div class="col">
        <div class="container text-center">
          <div class="row">
            <!-- Database Buttons -->
            <div class="col">
              <a th:href="@{/clients}" type="button" class="btn btn-secondary"><svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <circle cx="12" cy="6" r="4" stroke="#ffffff" stroke-width="1.5"></circle> <path d="M19.9975 18C20 17.8358 20 17.669 20 17.5C20 15.0147 16.4183 13 12 13C7.58172 13 4 15.0147 4 17.5C4 19.9853 4 22 12 22C14.231 22 15.8398 21.8433 17 21.5634" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></path> </g></svg> clients </a>
            </div>
            <div class="col">
               <a th:href="@{/invoices}" type="button" class="btn btn-secondary"><svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path fill-rule="evenodd" clip-rule="evenodd" d="M4.17157 3.17157C3 4.34315 3 6.22876 3 10V14C3 17.7712 3 19.6569 4.17157 20.8284C5.34315 22 7.22876 22 11 22H13C16.7712 22 18.6569 22 19.8284 20.8284C21 19.6569 21 17.7712 21 14V10C21 6.22876 21 4.34315 19.8284 3.17157C18.6569 2 16.7712 2 13 2H11C7.22876 2 5.34315 2 4.17157 3.17157ZM8 9.25C7.58579 9.25 7.25 9.58579 7.25 10C7.25 10.4142 7.58579 10.75 8 10.75H16C16.4142 10.75 16.75 10.4142 16.75 10C16.75 9.58579 16.4142 9.25 16 9.25H8ZM8 13.25C7.58579 13.25 7.25 13.5858 7.25 14C7.25 14.4142 7.58579 14.75 8 14.75H13C13.4142 14.75 13.75 14.4142 13.75 14C13.75 13.5858 13.4142 13.25 13 13.25H8Z" fill="#1C274C"></path> </g></svg> Invoices</a>
            </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



  <br>
  <br>
  <br>
  <div class="container text-center text-bg-dark">
    <br>
    <div class="row">
      <div class="col">
        <h2> Search </h1>
        <form class="d-flex" role="search" method="GET" action="/search">
          <input class="form-control me-2" name="keyword"  type="search" placeholder="Search" aria-label="Search"/>
          <button type="submit" class="btn btn-primary"><svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M11 6C13.7614 6 16 8.23858 16 11M16.6588 16.6549L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg></button>
        </form>
      </div>
    </div>
    <br>
  </div>


  <br>
  <br>
  <div class="container text-center">
    <div class="row">
      <!-- Sort buttons -->
            <div class="col">
              <a type="button" th:href="@{/sort(type='name')}" class="btn btn-info">Sort by Name</a>
            </div>
            <div class="col">
              <a type="button" th:href="@{/sort(type='date')}" class="btn btn-info">Sort by Date</a>
            </div>
            <div class="col">
              <a type="button" th:href="@{/sort(type='EMAIL')}" class="btn btn-info">Sort by Email</a>
            </div>
            <div class="col">
              <a type="button" th:href="@{/sort(type='INVOICE')}" class="btn btn-info">Sort by Invoice</a>
            </div>
            <div class="col">
              <a type="button" th:href="@{/sort(type='FORM')}" class="btn btn-info">Sort by Form</a>
            </div>
    </div>
  </div>





	



  <!-- Dashboard -->
	<table class="table">
  <thead>
    <tr>
      <th scope="col">Type</th>
      <th scope="col">Source</th>
      <th scope="col">Date</th>
      <th scope="col">Client_Name</th>
      <th scope="col">Email</th>
      <th scope="col">Phone</th>
      <th scope="col">Company</th>
      <th scope="col">Service_Interest</th>
      <th scope="col">Amount (€)</th>
      <th scope="col">VAT (€)</th>
      <th scope="col">Total_Amount (€)</th>
      <th scope="col">Invoice_Number</th>
      <th scope="col">Priority</th>
      <th scope="col">Message</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="data, iterStat: ${collectedData}">
      <th scope="row" th:text="${data.type}"></th>
      <td th:text="${data.source}"></td>
      <td th:text="${data.date}"></td>
      <td th:text="${data.clientName}"></td>
      <td th:text="${data.email}"></td>
      <td th:text="${data.phone}"></td>
      <td th:text="${data.company}"></td>
      <td th:text="${data.serviceInterest}"></td>
      <td th:text="${data.ammount}"></td>
      <td th:text="${data.VAT}"></td>
      <td th:text="${data.totalAmmount}"></td>
      <td th:text="${data.invoiceNumber}"></td>
      <td th:text="${data.priority}"></td>
      <td th:text="${data.Message}"></td>
